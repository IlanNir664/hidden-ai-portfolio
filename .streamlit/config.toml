[theme]
base = "dark"
backgroundColor = "#0A0D0A"
secondaryBackgroundColor = "#111712"
primaryColor = "#39FF6E"
textColor = "#EAF5EC"
# "sans serif" is one of the three base keywords Streamlit's theme engine accepts
# here; the actual geometric-sans font stack (system-local only, no network
# fetch -- see golden rule 2) is layered on top via the app's own CSS block.
font = "sans serif"

[server]
headless = true
